[global]

# Effect
blur = 0
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
shadows = 0
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff
border_radius = 8
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0

# Animation Configuration
animations = 1
layer_animations = 1
animation_type_open = "zoom"
animation_type_close = "slide"
layer_animation_type_open = "slide"
layer_animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.7
fade_in_begin_opacity = 0.8
fade_out_begin_opacity = 0.8
animation_duration_move = 300
animation_duration_open = 300
animation_duration_tag = 0
animation_duration_close = 200
animation_duration_focus = 200
animation_curve_open = [0.46, 1.0, 0.29, 1.1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.58, 0.98, 0.58, 0.98]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 1
edge_scroller_pointer_focus = 1
scroller_ignore_proportion_single = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Master-Stack Layout Setting
new_is_master = 0
smart_gaps = 0
default_master_factor = 0.55
default_master_count = 1

#Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 1

# Overview Setting
hotarea_size = 10
enable_hotarea = 1
overview_gap_inner = 5
overview_gap_outer = 30

# Misc
xwayland_persistence = 1
sync_obj_enable = 1
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_cross_tag = 0
circle_layout = ["tile", "scroller"]
enable_floating_snap = 1
snap_distance = 50
cursor_size = 24
cursor_theme = "Vimix-cursors"
cursor_hide_timeout = 0
drag_tile_to_tile = 1
single_scratchpad = 1

# keyboard
repeat_rate = 35
repeat_delay = 300
numlock_on = 1
xkb_rules_layout = "us"

# Trackpad
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
mouse_natural_scrolling = 0
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1
mouse_accel_profile = 2
mouse_accel_speed = 0.0

# Appearance
gap_inner_horizontal = 5
gap_inner_vertical = 5
gap_outer_horizontal = 5
gap_outer_vertical = 5
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 4
root_color = 0x201b14ff
border_color = 0x444444ff
focus_color = 0x8BAA9Bff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
maximized_screen_color = 0xBABD2Cff
urgent_color = 0xad401fff
scratchpad_color = 0xc4939dff
global_color = 0x8d64cfff
overlay_color = 0x95C381ff

# run autostart
exec_once = [
    "swaybg -i /home/riccardo/Pictures/Wallpapers/wallhaven-mlo6my.png",
    "swayidle -w timeout 300 'swaylock' timeout 600 'wlr-randr --output eDP-1 --off' resume 'wlr-randr --output edP-1 --on'",
    "foot --server",
    "wleave --service"
]

# Exec
exec = [
    "swayosd-server",
    "swayosd-libinput-backend"
]

[env]
GTK_IM_MODULE = "fcitx"
QT_IM_MODULE = "fcitx"
SDL_IGLFW_IM_MODULE = "ibus"
M_MODULE = "fcitx"
XMODIFIERS = "@im=fcitx"
GLFW_IM_MODULE = "ibus"
QT_QPA_PLATFORM = "Wayland;xcb"

[var]
term = "footclient"
launcher = "fuzzel"

[bind.default]

# menu and terminal
"SUPER+Return" = "spawn,$term"
"SUPER+d" = "spawn,$launcher"

# kill or exit
"SUPER+ALT+e" = "quit"
"SUPER+q" = "killclient,"
"SUPER+SHIFT+q" = "spawn,wleave"

# switch window focus
"Alt+Tab" = "overcircle,next"
"SUPER+Tab" = "togglejump"
"SUPER+shift+n" = "focusstack,next"
"SUPER+u" = "focuslast"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focus_window_or_workspace,up"
"SUPER+j" = "focus_window_or_workspace,down"

# swap window
"SUPER+SHIFT+k" = "move_client,up"
"SUPER+SHIFT+j" = "move_client,down"
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"

# resizewin
"SUPER+ALT+k" = "resizewin,+0,-50"
"SUPER+ALT+j" = "resizewin,+0,+50"
"SUPER+ALT+h" = "resizewin,-50,+0"
"SUPER+ALT+l" = "resizewin,+50,+0"

# switch window status
"SUPER+g" = "toggleglobal,"
"SUPER+v" = "togglefloating,"
"SUPER+f" = "togglemaximizescreen,"
"SUPER+SHIFT+f" = "togglefullscreen,"
"ALT+z" = "toggle_scratchpad"

# scroller layout
"SUPER+c" = "set_proportion,1.0"
"SUPER+r" = "switch_proportion_preset,"

# switch layout
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"
"SUPER+1" = "comboview,1"
"SUPER+2" = "comboview,2"
"SUPER+3" = "comboview,3"
"SUPER+4" = "comboview,4"
"SUPER+5" = "comboview,5"
"SUPER+6" = "comboview,6"
"SUPER+7" = "comboview,7"
"SUPER+8" = "comboview,8"
"SUPER+9" = "comboview,9"

# monitor switch
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"alt+shift+Up" = "focusmon,up"
"alt+shift+Down" = "focusmon,down"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"
"SUPER+Alt+Up" = "tagmon,up"
"SUPER+Alt+Down" = "tagmon,down"

# gaps
"SUPER+SHIFT+g" = "togglegaps"

# brightness and volume
# brightness and volume
"XF86AudioRaiseVolume" = "spawn,~/.config/mango/scripts/volume.sh up"
"XF86AudioLowerVolume" = "spawn,~/.config/mango/scripts/volume.sh down"
"XF86AudioMute" = "spawn,~/.config/mango/scripts/volume.sh mute"
"XF86AudioMicMute" = "spawn,~/.config/mango/scripts/volume.sh mic-mute"

# Brightness Schermo
"XF86MonBrightnessUp" = "spawn,~/.config/mango/scripts/brightness.sh up"
"XF86MonBrightnessDown" = "spawn,~/.config/mango/scripts/brightness.sh down"

# Brightness Tastiera HP
"XF86KbdBrightnessUp" = "spawn,~/.config/mango/scripts/brightness.sh kbd-up"
"XF86KbdBrightnessDown" = "spawn,~/.config/mango/scripts/brightness.sh kbd-down"

#custom app bind
"CTRL+ALT+l" = "spawn,swaylock"
"SUPER+e" = "spawn,firefox"
"SUPER+i" = "spawn,google-chrome"

[mousebind.default]

# Mouse Button Bindings
"SUPER+btn_left" = "moveresize,curmove"
"alt+btn_middle" = "set_proportion,0.5"
"SUPER+btn_right" = "moveresize,curresize"
"SUPER+CTRL+btn_left" = "minimized"
"SUPER+CTRL+btn_right" = "killclient"
"SUPER+CTRL+btn_middle" = "togglefullscreen"

[axisbind.default]

# Axis Bindings
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
"alt+UP" = "focusdir,left"
"alt+DOWN" = "focusdir,right"
"shift+super+UP" = "exchange_client,left"
"shift+super+DOWN" = "exchange_client,right"

[gesturebind.default]

# Gesturebind
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"


[[rule.window_rule]]
app_id = "firefox"
tags = 1

[[rule.window_rule]]
app_id = "google-chrome"
tags = 2

[[rule.window_rule]]
app_id = "^$term|foot"
tags = 3

[[rule.window_rule]]
app_id = "^(org\.gnome\.NautilusPreviewer|sushi)$"
is_floating = 1

[[rule.layer_rule]]
animation_type_open = "fade"
layer_name = "swayosd"

[[rule.layer_rule]]
animation_type_close = "fade"
layer_name = "swayosd"
