# ---------------------[ Globals ]-----------------------
set -g default-terminal "${TERM}"
set-option -g default-command bash
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g renumber-windows on
setw -g mode-keys vi

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Start numbers from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ---------------------[ Keybinds ]-----------------------
# Reload hot-key
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message " > Config reloaded!"

# Vim-like pane navigation
bind -r $ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Quick tmux-htop
bind-key -r H run-shell "tmux split-window -h bash -c 'htop'"

# New session
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
# Session-switch thourgh fzf
bind C-s display-popup -E "tmux list-sessions | sed -E 's/:.*//g' | grep -v \"^$(tmux diplay-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# ---------------------[ Styling ]-----------------------
# Palette
# BG="#141415"
BG="#0e1419"
GRAY="#252530"
FG="#cdcdcd"
RED="#E95678"
YELLOW="#E8EDA2"
GREEN="#87E58E"
BLUE="#456990"
CYAN="#A7DFEF"

# Pane borders
set -g pane-active-border-style "fg=$FG,bg=$BG"
set -g pane-border-style "fg=$GRAY,bg=$BG"

# Statusbar options
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 100

# Statusbar theme
set -g status-style "fg=$FG, bg=$BG"
set -g status-left "#[bg=$CYAN,fg=$BG] #[bg=$GRAY,fg=$FG,bold] #S "
set -g status-right "#[bg=$GRAY,fg=$FG] %H:%M | #H "

# Overview theme
set -g mode-style "fg=$BG,bg=$CYAN"

# Command/message line them
# hack for not bbackground color filling bar
set -gF message-style "fg=$BG,bg=$YELLOW,fill=$YELLOW,bold"

# Open windows aesthetics
setw -g window-status-current-format "#[fg=$BG,bg=$CYAN] #I:#W "
setw -g window-status-format "#[fg=$FG,bg=$GRAY] #I:#W "
set -g window-status-separator ""
