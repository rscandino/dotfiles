[main]
font=Maple Mono Medium:weight=regular
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e # Or your preferred terminal
prompt="❯ "
layer=overlay
width=40
lines=8
horizontal-pad=20
vertical-pad=12
inner-pad=8
dpi-aware=yes
sort-result=yes

[border]
radius=20
width=2

# Sorting

[colors]
background=0e1419ff
text=e2e2e2ff
prompt=c6c6c6ff
placeholder=e2e2e2ff
input=ffffffff
match=e2e2e2ff
selection=ffffff80
selection-text=e2e2e2ff
selection-match=1b1b1bff
counter=c6c6c6ff
border=6d9c7fff
