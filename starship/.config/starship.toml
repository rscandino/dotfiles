# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Dracula palette
palette = "almost-quiet"

# Minimal left prompt
format = """$hostname\
    $directory\
    $time\
    $golang\
    $python\
    $conda\
    $git_branch$git_status\
    $character"""

[username]
show_always = true
format = '[ $user ]($style)'

[character]
success_symbol = "[ ](bold bright_green)"
error_symbol = "[ 󰜝](bold red)"
vimcmd_symbol = "[ ](bold bright_green)"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'

[git_branch]
symbol = " "
format = '[\[$symbol$branch\]]($style)'
style = "green bold"

[golang]
symbol = '🐹'
format = '[\[$symbol($mod_version)\]]($style)'

[conda]
symbol = '🅒 '
format = '[\[$symbol$environment\]]($style)'
ignore_base = false
style = "green bold"

[python]
symbol = ''
format = '[\[${symbol}${pyenv_prefix}( $virtualenv)\]]($style)'

[vagrant]
format = '[\[[$symbol$version]($style)\]]($style)'
version_format = '${raw}'
symbol = 'V '

[directory]
read_only = " "
truncation_length = 3
truncation_symbol = '.../'
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '
style = "fg bold"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Projects" = "󰲋"
"Personal" = "󰲋"

[os]
disabled = false
#style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

